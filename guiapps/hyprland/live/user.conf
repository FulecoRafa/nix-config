# Ajustes do Hyprland editáveis durante o boot.
#
# O hyprland.conf gerado pelo Home Manager carrega este arquivo por último,
# então tudo aqui sobrescreve a configuração declarativa. O Hyprland recarrega
# sozinho ao salvar; erros aparecem em `hyprctl configerrors`.
#
#   live-config diff hyprland    # o que mudou
#   live-config reset hyprland   # descarta os testes
#   live-config save hyprland    # promove para guiapps/hyprland/live
#
# Ajustes estáveis devem migrar para guiapps/hyprland/default.nix.
