# Espectro para a onda do player da gaveta (Spectrum.qml): cada linha do
# stdout é um quadro, com as barras de 0 a 100 separadas por ";".
[general]
framerate = 40
bars = 12
autosens = 1
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 55
